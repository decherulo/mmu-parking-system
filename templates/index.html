<!DOCTYPE html>
<html>
<head>
    <title>MMU Parking System</title>
</head>
<body>
    <h1>MMU Parking System</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul>
        {% for msg in messages %}
          <li>{{ msg }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <h2>Available Slots: {{ free_slots|length }} / {{ total }}</h2>
    <p>Free slot numbers: {{ free_slots }}</p>

    <a href="{{ url_for('enter') }}"><button>Park a Vehicle (Entry)</button></a>
    <a href="{{ url_for('exit_vehicle') }}"><button>Exit / Pay</button></a>
</body>
</html>
